services:
  wordpress:
    image: wordpress:6.8-php8.4-apache
    ports:
      - "8888:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
    volumes:
      - wp-data:/var/www/html
      - ./:/var/www/html/wp-content/plugins/zest-cmp
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:5.7
    platform: linux/amd64
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp
      MYSQL_PASSWORD: wp
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10

  wp-cli:
    image: wordpress:cli-php7.4
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp-data:/var/www/html
      - ./:/var/www/html/wp-content/plugins/zest-cmp
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    entrypoint: |
      /bin/sh -c '
        sleep 5
        wp core install --url=http://localhost:8888 --title="Zest CMP Demo" --admin_user=admin --admin_password=admin --admin_email=admin@example.com --allow-root
        wp plugin activate zest-cmp --allow-root
        wp rewrite flush --allow-root
        echo "=== WordPress is ready ==="
        echo "URL:  http://localhost:8888"
        echo "Admin: http://localhost:8888/wp-admin (admin / admin)"
        tail -f /dev/null
      '

volumes:
  db-data:
  wp-data: