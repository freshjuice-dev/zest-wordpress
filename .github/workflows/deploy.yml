name: Deploy to WordPress.org SVN

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g. 1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7

      - name: Checkout Zest core repo
        uses: actions/checkout@v7
        with:
          repository: freshjuice-dev/zest
          path: zest-core

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build Zest core
        working-directory: zest-core
        run: |
          npm ci
          npm run build

      - name: Build plugin
        env:
          ZEST_REPO: ${{ github.workspace }}/zest-core
        run: ./scripts/build.sh

      - name: Build release zip
        run: |
          mkdir -p /tmp/zest-cmp
          rsync -a --exclude '.git*' --exclude '.github' --exclude 'node_modules' --exclude 'docker-compose*.yml' --exclude 'DEVELOPMENT.md' ./ /tmp/zest-cmp/
          cd /tmp && zip -rq "${{ github.workspace }}/zest-cmp.zip" zest-cmp

      - name: Attach zip to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: zest-cmp.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: WordPress.org SVN deploy
        uses: 10up/action-wordpress-plugin-deploy@2.3.0
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: zest-cmp
          ASSETS_DIR: assets